<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SGLang Review Inbox</title>
<link rel="icon" href="/assets/sgl-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* SGLang brand: orange #D55816, rust #A5300F, peach #F9E6DB/#F2CFBE/#FADDCD, cream #FBF6F1, ink #1F1410 */
:root {
  --canvas: #FBF6F1; --surface: #FFFFFF; --surface-2: #FDF8F4; --line: #EEE1D6; --line-strong: #E2CDBE;
  --ink: #1F1410; --ink-2: #4A372D; --muted: #8A7366;
  --accent: #D55816; --accent-ink: #FFFFFF; --accent-soft: #FADDCD; --rust: #A5300F;
  --peach: #F9E6DB; --peach-2: #F2CFBE;
  --ok: #2E7D4F; --ok-soft: #E3F1E8; --warn: #A86A12; --warn-soft: #FBEFD9; --bad: #B42318; --bad-soft: #FBE4E1;
  --code: #2A1D17; --code-ink: #F6E9DF;
  --shadow: 0 1px 2px rgba(31, 20, 16, .05), 0 4px 16px rgba(31, 20, 16, .05);
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #15100D; --surface: #1E1714; --surface-2: #241B17; --line: #33271F; --line-strong: #46352A;
    --ink: #F7EDE5; --ink-2: #DCC8BA; --muted: #A68D7E;
    --accent: #EC6E2E; --accent-ink: #1A0F0A; --accent-soft: #3D2216; --rust: #F08A5C;
    --peach: #2D1F18; --peach-2: #3A281E;
    --ok: #5CC489; --ok-soft: #173123; --warn: #E2AE52; --warn-soft: #33270F; --bad: #F2796C; --bad-soft: #3A1714;
    --code: #0F0B09; --code-ink: #F2E4D9;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #15100D; --surface: #1E1714; --surface-2: #241B17; --line: #33271F; --line-strong: #46352A;
  --ink: #F7EDE5; --ink-2: #DCC8BA; --muted: #A68D7E;
  --accent: #EC6E2E; --accent-ink: #1A0F0A; --accent-soft: #3D2216; --rust: #F08A5C;
  --peach: #2D1F18; --peach-2: #3A281E;
  --ok: #5CC489; --ok-soft: #173123; --warn: #E2AE52; --warn-soft: #33270F; --bad: #F2796C; --bad-soft: #3A1714;
  --code: #0F0B09; --code-ink: #F2E4D9;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--canvas); color: var(--ink); font: 14px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; }
code, .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 12.5px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; font-weight: 500; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: border-color .15s, background .15s; white-space: nowrap; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary:hover { background: var(--rust); border-color: var(--rust); color: #fff; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
button.ghost:hover { color: var(--ink); border-color: var(--line-strong); }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; cursor: not-allowed; }
input { font: inherit; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface);
  color: var(--ink); min-width: 0; }
input::placeholder { color: var(--muted); }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--canvas) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1240px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: 6px; }
.brand img { height: 30px; display: block; }
.brand .title { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand .sub { color: var(--muted); font-size: 12px; margin-top: -2px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px;
  font-weight: 500; background: var(--peach); color: var(--ink-2); white-space: nowrap; border: 1px solid transparent; }
.pill.live { background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.pill.shadow { background: var(--surface); border-color: var(--line-strong); cursor: pointer; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.off { background: var(--line-strong); }
.spacer { flex: 1; }
.statusline { display: flex; align-items: center; gap: 10px; margin: 0 2px 14px; flex-wrap: wrap; }
.statusline .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.add { display: flex; gap: 6px; }
.add input { width: 210px; }

/* layout */
main { max-width: 1240px; margin: 0 auto; padding: 20px; }
.tiles { display: grid; grid-template-columns: repeat(var(--tiles, 7), minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer;
  box-shadow: var(--shadow); text-align: left; transition: border-color .15s, transform .15s; }
.tile:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.tile .n { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--muted); font-size: 12px; font-weight: 500; margin-top: 2px; }
.tile.active { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-soft), var(--surface) 70%); }
.tile.active .n { color: var(--accent); }
.tile.hot .n { color: var(--accent); }
.section-head { display: flex; align-items: baseline; gap: 10px; margin: 4px 2px 10px; }
.section-head h2 { font-size: 15px; margin: 0; }
.section-head .hint { color: var(--muted); font-size: 12.5px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.row { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px 12px 18px;
  display: flex; gap: 14px; align-items: center; cursor: pointer; box-shadow: var(--shadow); transition: border-color .15s; overflow: hidden; }
.row:hover { border-color: var(--line-strong); }
.row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--rail, var(--line-strong)); }
.row .main { flex: 1; min-width: 0; }
.row .title { font-weight: 600; overflow-wrap: anywhere; }
.row .why { color: var(--ink-2); font-size: 13px; margin-top: 3px; }
.meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 500;
  background: var(--peach); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.accent { background: var(--accent-soft); color: var(--rust); }
.chip.outline { background: transparent; border: 1px solid var(--line-strong); }
.cibar { display: inline-flex; height: 6px; width: 72px; border-radius: 3px; overflow: hidden; background: var(--line); vertical-align: middle; }
.cibar span { display: block; height: 100%; }
.empty { text-align: center; color: var(--muted); padding: 48px 20px; background: var(--surface); border: 1px dashed var(--line-strong);
  border-radius: var(--radius); }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.group { margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.group .count { color: var(--muted); font-weight: 500; }
details > summary { cursor: pointer; color: var(--muted); font-weight: 500; margin: 14px 2px 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }

/* drawer */
#scrim { position: fixed; inset: 0; background: rgba(21, 16, 13, .28); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 9; }
#scrim.open { opacity: 1; pointer-events: auto; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(820px, 100%); background: var(--canvas); border-left: 1px solid var(--line);
  overflow-y: auto; transform: translateX(104%); transition: transform .2s ease; z-index: 10; }
#drawer.open { transform: none; }
.dhead { position: sticky; top: 0; z-index: 2; background: var(--canvas); border-bottom: 1px solid var(--line); padding: 16px 22px 12px; }
.dhead h1 { font-size: 18px; line-height: 1.35; margin: 6px 0 6px; overflow-wrap: anywhere; letter-spacing: -.01em; }
.dbody { padding: 16px 22px 40px; display: flex; flex-direction: column; gap: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.status { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--peach); color: var(--ink); font-size: 13px; margin-top: 10px; }
.status b { color: var(--rust); white-space: nowrap; }
.card h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; }
.kv .k { color: var(--muted); }
.finding { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface-2); }
.finding + .finding { margin-top: 8px; }
.finding .head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-weight: 600; }
.finding .path { color: var(--muted); margin: 4px 0 6px; }
.finding .comment { background: var(--code); color: var(--code-ink); border-radius: 8px; padding: 10px 12px; margin-top: 8px; white-space: pre-wrap; }
.finding p { margin: 4px 0; font-size: 13px; }
.cmd { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.cmd:first-of-type { border-top: 0; }
.cmd code { background: var(--peach); padding: 2px 8px; border-radius: 6px; overflow-wrap: anywhere; }
.mermaid-wrap { overflow-x: auto; background: var(--surface); border-radius: 10px; padding: 8px; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 0 10px 18px; font-size: 12.5px; color: var(--ink-2); }
.timeline li::before { content: ""; position: absolute; left: 4px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
.timeline li.action::before { background: var(--accent); }
.timeline li.error::before { background: var(--bad); }
.timeline li.merge::before { background: var(--ok); }
.timeline .t { color: var(--muted); margin-right: 6px; }
#slack-panel { max-width: 1240px; margin: 14px auto 0; padding: 0 20px; display: none; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 5px 10px; background: var(--surface); color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.notes { margin-top: 4px; font-size: 12px; color: var(--muted); }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--canvas);
  padding: 9px 16px; border-radius: 10px; display: none; z-index: 20; max-width: 90%; font-weight: 500; box-shadow: var(--shadow); }
@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 720px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .add input { width: 100%; } .add { flex: 1 1 100%; }
  .row { flex-direction: column; align-items: stretch; }
  .kv { grid-template-columns: 1fr; }
  main, .topbar-inner { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <div class="brand">
    <img src="/assets/sgl-wordmark.png" alt="SGLang">
    <div><div class="title">Review Inbox</div><div class="sub" id="who"></div></div>
  </div>
  <span id="mode" class="pill" role="button" tabindex="0"></span>
  <span class="spacer"></span>
  <div class="add"><input id="add-url"><button id="add-btn" data-i18n="add"></button></div>
  <button id="poll-btn" class="ghost" data-i18n="refresh"></button>
  <button id="slack-btn" class="ghost" data-i18n="connectSlack"></button>
  <div class="seg" role="group" aria-label="Language">
    <button id="lang-en" data-lang="en">EN</button><button id="lang-zh" data-lang="zh">中文</button>
  </div>
</div></div>
<div id="slack-panel"><div class="panel">
  <div style="font-weight:600;margin-bottom:4px" data-i18n="slackPanelTitle"></div>
  <div class="meta" style="margin-top:0" id="slack-panel-help"></div>
  <div class="actions" style="margin-top:10px">
    <input id="slack-token" type="password" autocomplete="off" placeholder="xoxp-..." size="42">
    <button id="slack-save" class="primary" data-i18n="slackSave"></button>
    <span id="slack-status" class="meta" style="margin-top:0"></span>
  </div>
</div></div>
<main>
  <div class="statusline"><span class="label" data-i18n="sources"></span><span id="sources" class="meta" style="margin:0"></span></div>
  <div class="tiles" id="tiles"></div>
  <div class="section-head"><h2 id="list-title"></h2><span class="hint" id="list-hint"></span></div>
  <div class="list" id="list"></div>
</main>
<div id="scrim"></div>
<aside id="drawer" aria-label="PR details"></aside>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);

      el("code", {}, s.command), chip(t("sendState")[s.state] || s.state, s.state === "done" ? "ok" : s.state === "todo" ? "outline" : "warn"),
      attempts[s.family] ? chip(t("tries", {n: attempts[s.family], m: 3}), "outline") : null,
      el("span", {class: "meta", style: "margin:0"}, s.why),
      ci.targeted && ci.targeted.url && s.family === "rerun-test" ? link(ci.targeted.url, t("targetedLink", {x: ci.targeted.state})) : null,
      s.state === "todo" && (c.stage === "ready" || state.mode !== "live") ? el("button", {onclick: () => doAction(c.key, "run_suggestion", {event: s.event})}, t("send")) : null)))
      : null);
}
function closeDrawer() {
  openKey = null;
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
}
document.getElementById("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
const toggleMode = async () => {
  const next = state.mode === "live" ? "shadow" : "live";
  if (next === "live" && !confirm(t("modeConfirm"))) return;
  await post("/api/mode", {mode: next}); refresh();
};
document.getElementById("mode").onclick = toggleMode;
document.getElementById("mode").onkeydown = e => { if (e.key === "Enter" || e.key === " ") toggleMode(); };
for (const b of document.querySelectorAll(".seg button")) b.onclick = () => setLang(b.dataset.lang);
document.getElementById("slack-btn").onclick = () => {
  const p = document.getElementById("slack-panel"); p.style.display = p.style.display === "block" ? "none" : "block";
};
document.getElementById("slack-save").onclick = async () => {
  const input = document.getElementById("slack-token"), status = document.getElementById("slack-status");
  status.textContent = t("checking");
  try { const r = await post("/api/slack-token", {token: input.value}); status.textContent = t("connectedTo", {x: r.team}); }
  catch (e) { status.textContent = t("failed", {x: e.message}); }
  input.value = "";
  refresh();
};
document.getElementById("poll-btn").onclick = async () => { await post("/api/poll", {}); toast(t("polling")); setTimeout(refresh, 1500); };
document.getElementById("add-btn").onclick = async () => {
  const input = document.getElementById("add-url");
  try { const r = await post("/api/add", {url: input.value}); toast(t("addedX", {x: r.added.join(", ")})); input.value = ""; }
  catch (e) { toast(t("failed", {x: e.message})); }
  refresh();
};
applyStatic();
refresh(); setInterval(refresh, 8000);
</script>
